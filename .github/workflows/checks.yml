name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - name: Bash installer (isolated destination)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n scripts/install.sh
          bash scripts/install.sh codex --skills-dir "$RUNNER_TEMP/autoscirub skills"
          bash scripts/install.sh codex --skills-dir "$RUNNER_TEMP/autoscirub skills" --check
          bash scripts/install.sh codex --bundle researchclawbench --skills-dir "$RUNNER_TEMP/autoscirub skills"
          bash scripts/install.sh codex --bundle researchclawbench --skills-dir "$RUNNER_TEMP/autoscirub skills" --check
      - name: PowerShell installer (isolated destination)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "autoscirub skills"
          & ./scripts/install.ps1 claude -SkillsDir $destination
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/install.ps1 claude -SkillsDir $destination -Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/install.ps1 claude -Bundle researchclawbench -SkillsDir $destination
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/install.ps1 claude -Bundle researchclawbench -SkillsDir $destination -Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
